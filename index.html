<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5b400">
  <title>Colmenar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <style>
    :root { --miel: #f5b400; --marron: #3b2a14; --crema: #fff8e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--crema); color: var(--marron); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { max-width: 420px; text-align: center; }
    .logo { width: 96px; height: 96px; margin: 0 auto 16px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { line-height: 1.5; margin: 0 0 12px; }
    .etapa { display: inline-block; background: var(--miel); color: var(--marron);
             border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem; }
    small { color: #7a6a4f; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="iconos/icono.svg" alt="">
    <h1>Colmenar</h1>
    <p>Gestión apícola: apiarios, revisiones, colmenas, cosecha y contabilidad.</p>
    <p><span class="etapa">Etapa 1 en construcción</span></p>
    <p><small>Versión 0.1 · base de datos lista · la app se publica acá a medida que avanza.</small></p>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
